<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16172b"/>
      <stop offset="1" stop-color="#0f1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.6" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9b6ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="0" fill="url(#bg)"/>
  <circle cx="1050" cy="70" r="260" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="180" cy="330" r="220" fill="#ec4899" opacity="0.06"/>

  <!-- Logo tile -->
  <g transform="translate(72,104)">
    <rect width="152" height="152" rx="34" fill="url(#accent)"/>
    <circle cx="76" cy="72" r="60" fill="#ffffff" opacity="0.10"/>
    <!-- equalizer bars -->
    <g fill="#ffffff">
      <rect x="34" y="76" width="11" height="34" rx="5.5"/>
      <rect x="52" y="58" width="11" height="70" rx="5.5"/>
      <rect x="70" y="44" width="11" height="98" rx="5.5"/>
      <rect x="88" y="64" width="11" height="58" rx="5.5"/>
    </g>
    <!-- note -->
    <g fill="#ffffff">
      <ellipse cx="104" cy="104" rx="15" ry="12"/>
      <rect x="114" y="46" width="6" height="58" rx="3"/>
      <path d="M120 46 L140 52 L137 68 L120 60 Z" opacity="0.85"/>
    </g>
  </g>

  <!-- Title -->
  <text x="268" y="150" font-size="62" font-weight="700" fill="url(#title)">Music Prompt Studio</text>
  <text x="270" y="196" font-size="25" fill="#9296bd">Tysiące gotowych promptów dla narzędzi AI do tworzenia muzyki</text>

  <!-- Tool chips -->
  <g font-size="17" font-weight="600">
    <g transform="translate(270,232)">
      <rect width="78" height="34" rx="17" fill="#8b5cf622" stroke="#8b5cf655"/>
      <text x="39" y="23" text-anchor="middle" fill="#b39dff">Suno</text>
    </g>
    <g transform="translate(358,232)">
      <rect width="76" height="34" rx="17" fill="#ec489922" stroke="#ec489955"/>
      <text x="38" y="23" text-anchor="middle" fill="#f19ccb">Udio</text>
    </g>
    <g transform="translate(444,232)">
      <rect width="92" height="34" rx="17" fill="#06b6d422" stroke="#06b6d455"/>
      <text x="46" y="23" text-anchor="middle" fill="#7fdcea">Mureka</text>
    </g>
    <g transform="translate(546,232)">
      <rect width="128" height="34" rx="17" fill="#f59e0b22" stroke="#f59e0b55"/>
      <text x="64" y="23" text-anchor="middle" fill="#f6c674">Stable Audio</text>
    </g>
    <g transform="translate(684,232)">
      <rect width="118" height="34" rx="17" fill="#22c55e22" stroke="#22c55e55"/>
      <text x="59" y="23" text-anchor="middle" fill="#8ee0a8">ElevenLabs</text>
    </g>
    <g transform="translate(812,232)">
      <rect width="104" height="34" rx="17" fill="#ef444422" stroke="#ef444455"/>
      <text x="52" y="23" text-anchor="middle" fill="#f3a3a3">Riffusion</text>
    </g>
    <g transform="translate(926,232)">
      <rect width="72" height="34" rx="17" fill="#3b82f622" stroke="#3b82f655"/>
      <text x="36" y="23" text-anchor="middle" fill="#9cc0fb">AIVA</text>
    </g>
    <g transform="translate(1008,232)">
      <rect width="104" height="34" rx="17" fill="#14b8a622" stroke="#14b8a655"/>
      <text x="52" y="23" text-anchor="middle" fill="#84dccf">Soundraw</text>
    </g>
  </g>

  <!-- Feature line -->
  <text x="270" y="308" font-size="18" fill="#6b7096">Generator AI (Gemini + Ollama)  ·  ulubione  ·  tagowanie  ·  eksport  ·  własne szablony  ·  PL / EN  ·  motyw jasny/ciemny</text>
</svg>
